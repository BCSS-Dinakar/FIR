<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Police Petition Analyzer | Multilingual Extraction</title>
    <meta name="description" content="AI-powered tool to analyze and translate handwritten police petitions in multiple languages using Google Gemini.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 650px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 300;
        }

        .upload-area {
            border: 2px dashed rgba(148, 163, 184, 0.4);
            background: rgba(15, 23, 42, 0.4);
            padding: 40px 20px;
            text-align: center;
            border-radius: 16px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
            background: linear-gradient(to bottom right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #uploadText {
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
        }

        #uploadSubtext {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 8px;
            display: block;
        }

        input[type="file"] {
            display: none;
        }

        .preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            object-fit: contain;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, var(--primary-hover), #7c3aed);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #loader {
            display: none;
            margin-top: 24px;
            text-align: center;
            color: var(--text-main);
            font-weight: 500;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        #result {
            margin-top: 24px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 12px;
            font-size: 15px;
            display: none;
            word-break: break-word;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }

        .result-success {
            border-left: 4px solid var(--success) !important;
        }

        .result-error {
            border-left: 4px solid var(--error) !important;
        }

        .sample-petitions {
            margin-bottom: 24px;
            text-align: center;
        }

        .sample-petitions p {
            color: var(--text-muted);
            margin-bottom: 12px;
            font-size: 14px;
        }

        .sample-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .sample-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .sample-img:hover {
            transform: scale(1.05);
            border-color: var(--primary);
            opacity: 1;
        }
        
        .sample-img.selected {
            border-color: var(--success);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
            opacity: 1;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body>

<main>
    <section class="glass-panel" aria-labelledby="main-heading">
        <header>
            <h1 id="main-heading">AI Petition Analyzer</h1>
            <p class="subtitle">Extract and translate handwritten police petitions across languages</p>
        </header>
        
        <form id="uploadForm">
            <div class="sample-petitions">
                <p>Or select a sample petition to analyze:</p>
                <div class="sample-grid">
                    <img src="test_petitions/english_petition.jpg" alt="English" title="English Petition" class="sample-img">
                    <img src="test_petitions/hindi_petition.png" alt="Hindi" title="Hindi Petition" class="sample-img">
                    <img src="test_petitions/malayalam_petition.png" alt="Malayalam" title="Malayalam Petition" class="sample-img">
                    <img src="test_petitions/marathi_petition.jpg" alt="Marathi" title="Marathi Petition" class="sample-img">
                    <img src="test_petitions/tamil_petition.png" alt="Tamil" title="Tamil Petition" class="sample-img">
                    <img src="test_petitions/telugu_petition.jpg" alt="Telugu" title="Telugu Petition" class="sample-img">
                </div>
            </div>

            <label class="upload-area" id="dropArea" tabindex="0">
                <div id="uploadContent">
                    <span class="upload-icon">📄</span>
                    <span id="uploadText">Drag & Drop or Click to Browse</span>
                    <span id="uploadSubtext">Supports JPG, PNG</span>
                </div>
                <img id="imagePreview" class="preview" alt="Selected petition preview">
                <input type="file" id="fileInput" name="petitionImage" accept="image/*" required aria-label="Upload petition image">
            </label>
            
            <button type="submit" id="submitBtn">Analyze with AI</button>
        </form>

        <div id="loader" aria-live="polite">
            <span style="font-size: 20px; margin-right: 8px; display: inline-block; animation: spin 2s linear infinite;">⚙️</span> 
            Analyzing image... this may take a moment.
        </div>
        <div id="result" aria-live="polite"></div>
    </section>
</main>

<style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<script>
    const fileInput = document.getElementById('fileInput');
    const uploadContent = document.getElementById('uploadContent');
    const imagePreview = document.getElementById('imagePreview');
    const dropArea = document.getElementById('dropArea');

    // Drag and drop effects
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
    });

    dropArea.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        if(files.length > 0) {
            document.querySelectorAll('.sample-img').forEach(i => i.classList.remove('selected'));
            fileInput.files = files;
            updatePreview(files[0]);
        }
    }

    // Show image preview when selected
    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            document.querySelectorAll('.sample-img').forEach(i => i.classList.remove('selected'));
            updatePreview(this.files[0]);
        }
    });

    function updatePreview(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
            uploadContent.style.display = 'none';
            dropArea.style.padding = '15px';
        }
        reader.readAsDataURL(file);
    }

    // Sample image selection
    const sampleImages = document.querySelectorAll('.sample-img');
    
    sampleImages.forEach(img => {
        img.addEventListener('click', async () => {
            // Fetch the image and create a File object
            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                
                // Extract filename from src
                const filename = img.src.split('/').pop();
                const file = new File([blob], filename, { type: blob.type });
                
                // Create a DataTransfer object to assign to fileInput
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                fileInput.files = dataTransfer.files;
                
                // Remove selected class from all
                sampleImages.forEach(i => i.classList.remove('selected'));
                // Add selected class to this
                img.classList.add('selected');
                
                // Trigger preview
                updatePreview(file);
            } catch (error) {
                console.error('Error loading sample image:', error);
                alert('Could not load the sample image.');
            }
        });
    });

    // Keyboard accessibility for drop area
    dropArea.addEventListener('keydown', function(e) {
        if(e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            fileInput.click();
        }
    });

    // Handle form submission
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const file = fileInput.files[0];
        if (!file) return alert('Please select an image first.');

        const formData = new FormData();
        formData.append('petitionImage', file);

        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';
        loader.style.display = 'block';
        resultDiv.style.display = 'none';
        resultDiv.className = ''; // Reset classes

        try {
            // Send to our local Express microservice
            const apiUrl = window.location.protocol === 'file:' 
                ? 'http://localhost:3000/api/analyze-petition' 
                : '/api/analyze-petition';
                
            const response = await fetch(apiUrl, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Server error');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let finalData = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n').filter(line => line.trim());
                
                for (const line of lines) {
                    try {
                        const data = JSON.parse(line);
                        if (data.status === 'progress') {
                            loader.innerHTML = `<span style="font-size: 20px; margin-right: 8px; display: inline-block; animation: spin 2s linear infinite;">⚙️</span> ${data.message}`;
                        } else if (data.status === 'complete') {
                            finalData = data;
                        } else if (data.status === 'error') {
                            throw new Error(data.message);
                        }
                    } catch(e) {
                        if (e.message !== "Unexpected end of JSON input" && !e.message.includes("Unexpected token")) {
                            throw e;
                        }
                    }
                }
            }
            
            resultDiv.style.display = 'block';
            if (finalData) {
                resultDiv.classList.add('result-success');
                resultDiv.innerHTML = generateReportHTML(finalData);
            }
        } catch (error) {
            resultDiv.style.display = 'block';
            resultDiv.classList.add('result-error');
            resultDiv.innerHTML = `<strong style="color: var(--error); font-family: 'Outfit', sans-serif;">✗ Connection Error</strong>\nEnsure the server is running on port 5001.\n${error.message}`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Analyze with AI';
            loader.style.display = 'none';
        }
    });

    function generateReportHTML(data) {
        const s1 = data.step1 || {};
        const s2 = data.step2 || {};

        let statusColor = 'var(--success)';
        if (s2.status === 'INVALID') statusColor = 'var(--error)';
        if (s2.status === 'INCOMPLETE') statusColor = '#f59e0b';

        let html = \`
            <div style="margin-bottom: 20px;">
                <h3 style="display: inline-block; margin-right: 15px; color: white;">Petition Analysis</h3>
                <span style="background-color: \${statusColor}; color: white; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 13px;">
                    \${s2.status || 'UNKNOWN'}
                </span>
            </div>
        \`;

        if (s2.missing_fields && s2.missing_fields.length > 0) {
            html += \`
            <div style="margin-bottom: 15px;">
                <strong style="color: #fca5a5;">❌ Missing Information:</strong>
                <ul style="margin-top: 8px; margin-left: 20px; color: #e2e8f0; line-height: 1.8;">
                    \${s2.missing_fields.map(field => \`<li>Missing \${field.replace(/\\./g, ' ').replace(/_/g, ' ')}</li>\`).join('')}
                </ul>
            </div>\`;
        }

        if (s2.errors && s2.errors.length > 0) {
            html += \`
            <div style="margin-bottom: 15px;">
                <strong style="color: var(--error);">⚠️ Errors:</strong>
                <ul style="margin-top: 8px; margin-left: 20px; color: #e2e8f0; line-height: 1.8;">
                    \${s2.errors.map(e => \`<li>\${e}</li>\`).join('')}
                </ul>
            </div>\`;
        }

        if (s2.warnings && s2.warnings.length > 0) {
            html += \`
            <div style="margin-bottom: 15px;">
                <strong style="color: #f59e0b;">⚠️ Warnings:</strong>
                <ul style="margin-top: 8px; margin-left: 20px; color: #e2e8f0; line-height: 1.8;">
                    \${s2.warnings.map(w => \`<li>\${w}</li>\`).join('')}
                </ul>
            </div>\`;
        }

        const w = s2.five_w_h || {};
        html += \`
            <div style="margin-bottom: 15px;">
                <strong style="color: #60a5fa;">📝 5W1H Summary:</strong>
                <ul style="margin-top: 8px; margin-left: 20px; color: #e2e8f0; line-height: 1.8;">
                    <li><strong>WHO:</strong> \${w.who?.complainant?.name || 'Unknown'} (Complainant), \${w.who?.accused?.name || 'Unknown'} (Accused)</li>
                    <li><strong>WHAT:</strong> \${w.what?.incident?.description || 'Unknown'}</li>
                    <li><strong>WHEN:</strong> \${w.when?.time?.description || 'Unknown'}</li>
                    <li><strong>WHERE:</strong> \${w.where?.location?.description || 'Unknown'}</li>
                    <li><strong>WHY:</strong> \${w.why?.motive?.description || 'Unknown'}</li>
                    <li><strong>HOW:</strong> \${w.how?.method?.description || 'Unknown'}</li>
                </ul>
            </div>
        \`;

        html += \`
            <div style="margin-top: 24px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <strong style="color: #60a5fa;">🌐 Translated Text (\${s1.original_language || 'Unknown'}):</strong>
                <p style="margin-top: 10px; color: #cbd5e1; white-space: pre-wrap; font-size: 14px;">\${s1.english_translation || 'No translation available.'}</p>
            </div>
        \`;

        return html;
    }
</script>

</body>
</html>
